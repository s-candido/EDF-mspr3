apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: ml-platform
  labels:
    app: postgresql
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:13
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ml-platform-secrets
                  key: POSTGRES_USER_AIRFLOW
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ml-platform-secrets
                  key: POSTGRES_PASSWORD_AIRFLOW
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ml-platform-secrets
                  key: POSTGRES_DB_AIRFLOW
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "airflow"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "airflow"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-airflow-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: ml-platform
spec:
  selector:
    app: postgresql
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  clusterIP: None
