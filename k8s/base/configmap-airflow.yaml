apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config
  namespace: ml-platform
data:
  AIRFLOW__CORE__EXECUTOR: "CeleryExecutor"
  AIRFLOW__CORE__DAGS_IN_IMAGE: "False"
  AIRFLOW__CELERY__FLOWER_PORT: "5555"
  AIRFLOW__WEBSERVER__WEB_SERVER_HOST: "0.0.0.0"
  AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
  AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
  AIRFLOW__ELASTICSEARCH__HOST: "elasticsearch"
  AIRFLOW__ELASTICSEARCH__LOG_ID_TEMPLATE: "{dag_id}-{task_id}-{run_id}-{map_index}-{try_number}"
  AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
  AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: "s3://{{ var.value.AIRFLOW_BUCKET }}/logs"
  AIRFLOW__LOGGING__WORKING_LOG_FOLDER: "/opt/airflow/logs"
  AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: "aws_default"
  # MLFlow Configuration
  MLFLOW_VIRTUAL_HOST: "0.0.0.0"
  MLFLOW_VIRTUAL_PORT: "5000"
  MLFLOW_REMOTE_TRACKING_URI: "http://mlflow:5000"
  MLFLOW_ARTIFACT_PATH: "/mlflow/artifacts"
  MLFLOW_S3_ENDPOINT_URL: "$(S3_ENDPOINT_URL)"
  MLFLOW_AWS_ACCESS_KEY_ID: "$(AWS_ACCESS_KEY_ID)"
  MLFLOW_AWS_SECRET_ACCESS_KEY: "$(AWS_SECRET_ACCESS_KEY)"
  MLFLOW_AWS_DEFAULT_REGION: "$(AWS_DEFAULT_REGION)"
  GIT_PYTHON_REFRESH: "quiet"
