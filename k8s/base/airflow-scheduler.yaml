apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: ml-platform
  labels:
    app: airflow
    component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
      component: scheduler
  template:
    metadata:
      labels:
        app: airflow
        component: scheduler
    spec:
      initContainers:
        - name: init-db
          image: apache/airflow:2.8.1-python3.10
          command:
            - sh
            - -c
            - |
              echo "Waiting for database..."
              until python -c "import psycopg2; psycopg2.connect('postgresql://airflow:airflow@postgresql/airflow')" 2>/dev/null; do
                sleep 5
              done
              echo "Database ready"
              airflow db init || true
              airflow db migrate || true
              airflow users create \
                --username admin \
                --password admin123 \
                --firstname Admin \
                --lastname User \
                --role Admin \
                --email admin@example.com || echo "User already exists"
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: ml-platform-secrets
                  key: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
      containers:
        - name: scheduler
          image: enjalbert/edf-airflow:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: ml-platform-secrets
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: "CeleryExecutor"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: ml-platform-secrets
                  key: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
            - name: AIRFLOW__CELERY__RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: ml-platform-secrets
                  key: AIRFLOW__CELERY__RESULT_BACKEND
            - name: AIRFLOW__CELERY__BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: ml-platform-secrets
                  key: AIRFLOW__CELERY__BROKER_URL
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: ml-platform-secrets
                  key: AIRFLOW__CORE__FERNET_KEY
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ml-platform-secrets
                  key: AIRFLOW__WEBSERVER__SECRET_KEY"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ml-platform-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ml-platform-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: ml-platform-secrets
                  key: S3_ENDPOINT_URL
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
            - name: logs
              mountPath: /opt/airflow/logs
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: dags
          persistentVolumeClaim:
            claimName: s3-raw-storage
        - name: logs
          persistentVolumeClaim:
            claimName: s3-raw-storage
